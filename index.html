  <!--
    Fonts were previously requested three ways: a Typekit stylesheet, an @import
    nested inside an inline <style> (the slowest possible form — it cannot be
    discovered by the preload scanner), and a duplicate @import in
    styles/typography.css. Only Fraunces and Manrope are actually used, so this
    is now a single discoverable stylesheet with the handshake warmed up front.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Manrope:wght@200..800&display=swap" />
